<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - RoomSync</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-5 mt-5">

            <div class="card shadow border-0 p-4">

                <h2 class="text-center fw-bold">
                    Welcome Back
                </h2>

                <p class="text-center text-muted">
                    Login to RoomSync
                </p>

                {% if messages %}

                    {% for message in messages %}

                        <div class="alert alert-danger">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label class="form-label">
                            Username
                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        class="btn w-100 text-white"
                        style="background:#0f9d8a;"
                    >
                        Login
                    </button>

                </form>

                <p class="text-center mt-3">

                    Don't have an account?

                    <a href="{% url 'register' %}">
                        Create Account
                    </a>

                </p>

            </div>

        </div>

    </div>

</div>

</body>
</html>
