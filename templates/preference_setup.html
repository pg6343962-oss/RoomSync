<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Preferences - RoomSync</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card border-0 shadow p-4">

                <h2 class="fw-bold">
                    Your Roommate Preferences
                </h2>

                <p class="text-muted">
                    Tell us what you're looking for.
                </p>

                <form method="POST">

                    {% csrf_token %}

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Minimum Budget
                            </label>

                            <input
                                type="number"
                                name="budget_min"
                                class="form-control"
                                required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Maximum Budget
                            </label>

                            <input
                                type="number"
                                name="budget_max"
                                class="form-control"
                                required>
                        </div>

                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Preferred Location
                        </label>

                        <input
                            type="text"
                            name="preferred_location"
                            class="form-control"
                            placeholder="e.g. Lucknow"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Food Preference
                        </label>

                        <select
                            name="food_preference"
                            class="form-select"
                            required>

                            <option value="">
                                Select
                            </option>

                            <option value="veg">
                                Vegetarian
                            </option>

                            <option value="non_veg">
                                Non-Vegetarian
                            </option>

                            <option value="both">
                                Both
                            </option>

                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Smoking
                        </label>

                        <select name="smoking"
                                class="form-select">

                            <option value="no">
                                No
                            </option>

                            <option value="yes">
                                Yes
                            </option>

                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Pets
                        </label>

                        <select name="pets"
                                class="form-select">

                            <option value="no">
                                No
                            </option>

                            <option value="yes">
                                Yes
                            </option>

                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Sleep Schedule
                        </label>

                        <select name="sleep_schedule"
                                class="form-select">

                            <option value="early">
                                Early Sleeper
                            </option>

                            <option value="late">
                                Late Sleeper
                            </option>

                            <option value="flexible">
                                Flexible
                            </option>

                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Cleanliness Level (1–5)
                        </label>

                        <input
                            type="number"
                            name="cleanliness"
                            class="form-control"
                            min="1"
                            max="5"
                            value="3">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Noise Preference (1–5)
                        </label>

                        <input
                            type="number"
                            name="noise_preference"
                            class="form-control"
                            min="1"
                            max="5"
                            value="3">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Guests Preference (1–5)
                        </label>

                        <input
                            type="number"
                            name="guests_preference"
                            class="form-control"
                            min="1"
                            max="5"
                            value="3">
                    </div>

                    <button
                        type="submit"
                        class="btn text-white w-100"
                        style="background:#0f9d8a;">

                        Save Preferences

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
