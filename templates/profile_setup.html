<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Profile Setup - RoomSync</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card border-0 shadow p-4">

                <h2 class="fw-bold">
                    Complete Your Profile
                </h2>

                <p class="text-muted">
                    Help us find better roommate matches for you.
                </p>

                <form method="POST"
                      enctype="multipart/form-data">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label class="form-label">
                            Full Name
                        </label>

                        <input
                            type="text"
                            name="full_name"
                            class="form-control"
                            value="{{ profile.full_name }}"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Age
                        </label>

                        <input
                            type="number"
                            name="age"
                            class="form-control"
                            value="{{ profile.age|default:'' }}"
                            min="18"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Gender
                        </label>

                        <select name="gender"
                                class="form-select"
                                required>

                            <option value="">
                                Select Gender
                            </option>

                            <option value="male">
                                Male
                            </option>

                            <option value="female">
                                Female
                            </option>

                            <option value="other">
                                Other
                            </option>

                        </select>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            City
                        </label>

                        <input
                            type="text"
                            name="city"
                            class="form-control"
                            value="{{ profile.city }}"
                            placeholder="e.g. Lucknow"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Occupation
                        </label>

                        <select name="occupation"
                                class="form-select"
                                required>

                            <option value="">
                                Select Occupation
                            </option>

                            <option value="student">
                                Student
                            </option>

                            <option value="working">
                                Working
                            </option>

                            <option value="other">
                                Other
                            </option>

                        </select>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Profile Photo
                        </label>

                        <input
                            type="file"
                            name="profile_photo"
                            class="form-control"
                            accept="image/*"
                        >

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            About You
                        </label>

                        <textarea
                            name="bio"
                            class="form-control"
                            rows="4"
                            placeholder="Tell something about yourself..."
                        >{{ profile.bio }}</textarea>

                    </div>

                    <button
                        type="submit"
                        class="btn text-white w-100"
                        style="background:#0f9d8a;"
                    >
                        Save Profile
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
